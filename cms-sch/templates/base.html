<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ data.name }} - Solusi Properti Terpercaya{% endblock %}</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='v2/perumahan.output.css') }}">
</head>

<body class="font-poppins bg-light text-dark selection:bg-primary selection:text-white">

    <!-- Floating WhatsApp -->
    <a href="{{ data.whatsapp_url }}" target="_blank"
        class="fixed right-6 bottom-6 md:right-10 md:bottom-10 bg-wa text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform duration-300 z-50 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z" />
        </svg>
    </a>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-2xl font-bold text-primary">
                        PROPERTY<span class="text-dark"> JAYAPURA</span>
                    </a>
                </div>
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="/" class="text-gray-700 hover:text-primary font-medium transition duration-300">Home</a>
                    <a href="/about-us"
                        class="text-gray-700 hover:text-primary font-medium transition duration-300">About Us</a>
                    <a href="/properti"
                        class="text-gray-700 hover:text-primary font-medium transition duration-300">Properti</a>
                    <a href="/facility"
                        class="text-gray-700 hover:text-primary font-medium transition duration-300">Fasilitas</a>
                    <a href="/news"
                        class="text-gray-700 hover:text-primary font-medium transition duration-300">News</a>
                    <a href="/contact"
                        class="bg-primary hover:bg-primary-hover text-white px-5 py-2 rounded-full font-medium transition duration-300">Contact Us</a>
                </div>
            </div>
        </div>
    </header>

    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center">
            <div class="mb-6 md:mb-0">
                <a href="/" class="text-2xl font-bold text-white mb-2 block">
                    PROPERTY<span class="text-primary"> JAYAPURA</span>
                </a>
                <p class="text-gray-400">Solusi Properti Terpercaya</p>
            </div>

            <div class="text-gray-400 mb-6 md:mb-0">
                <ul class="flex justify-center md:justify-start space-x-6">
                    <li><a href="/" class="hover:text-primary transition">Home</a></li>
                    <li><a href="/about-us" class="hover:text-primary transition">About Us</a></li>
                    <li><a href="/properti" class="hover:text-primary transition">Properti</a></li>
                </ul>
            </div>

            <div class="text-gray-400 text-sm">
                &copy; 2026 {{ data.name }}.<br>All rights reserved.
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='v2/slider.js') }}"></script>
</body>

</html>
